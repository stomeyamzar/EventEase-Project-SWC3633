<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage events | EventEase</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="topbar"><a class="brand" href="index.html">Event<span>Ease</span></a><nav><a href="index.html">Explore</a><a href="my-bookings.html">Bookings</a><a href="login.html">Login</a></nav></header><main class="section"><p class="eyebrow">ORGANISER WORKSPACE</p><h1>Manage events</h1><p id="notice" class="notice" role="status"></p><section class="manage-form"><h2 id="form-title">Create event</h2><form id="event-form" class="auth-form"><input type="hidden" name="event_id"><label>Event title<input name="title" required maxlength="180"></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Category<input name="category" required></label><label>Venue<select name="venue_id" required id="venue-select"></select></label><label>Date and time<input name="event_date" type="datetime-local" required></label><label>Ticket price (RM)<input name="ticket_price" type="number" min="0" step="0.01" required></label><label>Total tickets<input name="total_tickets" type="number" min="1" step="1" required></label><label>Status<select name="status"><option value="DRAFT">DRAFT</option><option value="PUBLISHED">PUBLISHED</option><option value="CANCELLED">CANCELLED</option><option value="COMPLETED">COMPLETED</option></select></label><div class="form-actions"><button class="button" type="submit">Save event</button><button class="button secondary" type="button" id="reset-form">Clear</button></div></form></section><h2>Your events</h2><div id="manage-list" class="booking-list"></div></main><script src="assets/js/config.js"></script><script src="assets/js/auth-ui.js"></script><script src="assets/js/manage-events.js"></script></body></html>
